<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>WebClass — Учитель</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: #1e293b;
            padding: 14px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .btn {
            background: #4f46e5;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: #4338ca;
        }

        #status {
            font-size: 14px;
            color: #a5b4fc;
        }

        #videoTeacher, #videoStudent {
            width: 100%;
            max-height: 45vh;
            background: black;
        }

        .container {
            padding: 16px;
        }

        .linkbox {
            margin-top: 12px;
            padding: 12px;
            background: #1e293b;
            border-radius: 10px;
            font-size: 14px;
            word-break: break-all;
        }
    </style>
</head>

<body>

<header>
    <div>
        👨‍🏫 Учитель: <span id="teacherName">—</span>
    </div>
    <button class="btn" id="copyBtn">Скопировать ссылку ученику</button>
</header>

<div class="container">
    <div id="status">Статус: подключение…</div>

    <h3>Ваше видео:</h3>
    <video id="videoTeacher" autoplay playsinline muted></video>

    <h3>Видео ученика:</h3>
    <video id="videoStudent" autoplay playsinline></video>

    <div class="linkbox" id="studentLinkBox">
        Ссылка ученику появится здесь…
    </div>
</div>

<script>
    const teacherVideo = document.getElementById("videoTeacher");
    const studentVideo = document.getElementById("videoStudent");
    const statusDiv = document.getElementById("status");
    const nameSpan = document.getElementById("teacherName");
    const linkBox = document.getElementById("studentLinkBox");

    const params = new URLSearchParams(window.location.search);
    const teacherName = params.get("name") || "Учитель";
    const room = params.get("room") || "test";

    nameSpan.textContent = teacherName;

    const studentURL =
        `${window.location.origin}/student.html?name=Ученик&room=${room}`;

    linkBox.textContent = studentURL;

    document.getElementById("copyBtn").onclick = () => {
        navigator.clipboard.writeText(studentURL);
        alert("Ссылка скопирована!");
    };

    // WebRTC
    const pc = new RTCPeerConnection({
        iceServers: [
            { urls: ["stun:fr-turn4.xirsys.com"] },
            {
                username: "SbW8Rnpqh1htOMYUh2YIoB67iO9KSTyAFc55y_yISl2exds__kZpJxVzcjElsxBKAAAAAGkjfIpkZW5uaXNNYXJrb3Y=",
                credential: "625c7f26-c8b3-11f0-9366-5ec4b59bd929",
                urls: [
                    "turn:fr-turn4.xirsys.com:80?transport=udp",
                    "turn:fr-turn4.xirsys.com:3478?transport=udp",
                    "turn:fr-turn4.xirsys.com:80?transport=tcp",
                    "turn:fr-turn4.xirsys.com:3478?transport=tcp",
                    "turns:fr-turn4.xirsys.com:443?transport=tcp",
                    "turns:fr-turn4.xirsys.com:5349?transport=tcp"
                ]
            }
        ]
    });

    const ws = new WebSocket(
        "wss://webclass-backend-g3uh.onrender.com/ws?room=" + room + "&role=teacher"
    );

    ws.onopen = () => {
        statusDiv.textContent = "Статус: ждём ученика…";
    };

    ws.onmessage = async (msg) => {
        const data = JSON.parse(msg.data);

        if (data.type === "offer") {
            await pc.setRemoteDescription(data.offer);
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            ws.send(
                JSON.stringify({ type: "answer", answer: answer })
            );
        }

        if (data.type === "ice-candidate") {
            try {
                await pc.addIceCandidate(data.candidate);
            } catch (e) {
                console.error("ICE ошибка", e);
            }
        }
    };

    pc.onicecandidate = (event) => {
        if (event.candidate) {
            ws.send(
                JSON.stringify({ type: "ice-candidate", candidate: event.candidate })
            );
        }
    };

    pc.ontrack = (event) => {
        studentVideo.srcObject = event.streams[0];
        statusDiv.textContent = "Статус: ученик подключён!";
    };

    async function startCamera() {
        try {
            let stream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: true,
            });
            teacherVideo.srcObject = stream;

            stream.getTracks().forEach((t) => pc.addTrack(t, stream));
        } catch (e) {
            alert("Не удалось открыть камеру/микрофон");
            console.error(e);
        }
    }

    startCamera();
</script>

</body>
</html>
