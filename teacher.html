<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>WebClass • Teacher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg-main: radial-gradient(circle at top, #0f172a 0, #020617 38%, #000 100%);
      --card-bg: rgba(15, 23, 42, 0.96);
      --card-border: rgba(37, 99, 235, 0.5);
      --accent: #f97316;
      --accent-soft: rgba(249, 115, 22, 0.2);
      --accent-2: #4f46e5;
      --text-main: #e5e7eb;
      --text-soft: #9ca3af;
      --danger: #ef4444;
      --radius-lg: 18px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      background: #020617;
      color: var(--text-main);
    }

    body {
      background-image: var(--bg-main);
      background-attachment: fixed;
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 10px 16px 16px;
      gap: 10px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 12px;
      background: radial-gradient(circle at 20% 0, #f97316, #4f46e5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: #020617;
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.75),
        0 10px 25px rgba(15, 23, 42, 0.8);
    }

    .brand-text strong {
      display: block;
      font-size: 16px;
    }

    .brand-text span {
      display: block;
      font-size: 12px;
      color: var(--text-soft);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .invite-block {
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.4);
      min-width: 240px;
      max-width: 480px;
    }

    .invite-title {
      font-size: 11px;
      color: var(--text-soft);
      margin-bottom: 4px;
    }

    .invite-url-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #inviteUrl {
      flex: 1;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 4px 8px;
      border-radius: var(--radius-pill);
      background: rgba(15, 23, 42, 0.85);
      border: 1px dashed rgba(148, 163, 184, 0.5);
    }

    #copyInviteBtn {
      border-radius: var(--radius-pill);
      border: none;
      background: linear-gradient(135deg, #facc15, #f97316);
      color: #0f172a;
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 18px rgba(248, 250, 252, 0.16);
    }

    #copyInviteBtn span {
      font-size: 15px;
    }

    .app-main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(260px, 1.2fr);
      gap: 12px;
      min-height: 0;
    }

    .video-panel {
      background: rgba(15, 23, 42, 0.94);
      border-radius: var(--radius-lg);
      border: 1px solid var(--card-border);
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.9);
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      min-height: 0;
    }

    .video-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .video-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #16a34a;
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.18);
    }

    .video-header-text strong {
      display: block;
      font-size: 14px;
    }

    .video-header-text span {
      display: block;
      font-size: 12px;
      color: var(--text-soft);
    }

    .video-header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .swap-btn,
    .fs-btn,
    .mute-remote-btn {
      border-radius: var(--radius-pill);
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .fs-btn-icon {
      font-size: 14px;
    }

    #qualitySelectTeacher {
      border-radius: var(--radius-pill);
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      font-size: 12px;
      padding: 4px 8px;
    }

    /* >>> главная зона видео занимает всю высоту карточки <<< */
    .video-body {
      border-radius: 14px;
      background: radial-gradient(circle at top left, #1f2937, #020617);
      padding: 8px;
      position: relative;
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .main-video-wrapper {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(30, 64, 175, 0.7);
      background: #000;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.8);
      flex: 1;
      min-height: 0;
    }

    #mainVideo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #000;
    }

    .self-box {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 260px;
      max-width: 32vw;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(148, 163, 184, 0.7);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(6px);
      cursor: move; /* перетаскивание */
      z-index: 10;
    }

    .self-box-header,
    .self-box-footer {
      padding: 4px 8px;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-soft);
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.95), #020617);
    }

    .self-box-header span:first-child {
      font-weight: 500;
      color: var(--text-main);
    }

    #selfVideo {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #020617;
    }

    .pill-btn,
    .toggle-self-btn {
      border-radius: var(--radius-pill);
      border: none;
      padding: 4px 9px;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
    }

    .pill-btn {
      border: 1px solid rgba(148, 163, 184, 0.7);
    }

    .dot-mic {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #22c55e;
    }

    .fs-hint {
      margin-top: 5px;
      font-size: 11px;
      color: var(--text-soft);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-kbd {
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      padding: 0 5px;
      font-size: 10px;
    }

    .side-panel {
      background: rgba(15, 23, 42, 0.96);
      border-radius: var(--radius-lg);
      border: 1px solid var(--card-border);
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.95);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .side-header h2 {
      margin: 0;
      font-size: 15px;
    }

    .side-header span {
      font-size: 12px;
      color: var(--text-soft);
    }

    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
    }

    .chat-messages {
      flex: 1;
      min-height: 0;
      border-radius: 12px;
      background: radial-gradient(circle at top, #020617, #020617);
      border: 1px solid rgba(30, 64, 175, 0.6);
      padding: 6px 6px 8px;
      overflow-y: auto;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-message {
      max-width: 92%;
      padding: 6px 8px;
      border-radius: 11px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(30, 64, 175, 0.5);
    }

    .chat-message.me {
      align-self: flex-end;
      background: radial-gradient(circle at top, #f97316, #ea580c);
      border-color: transparent;
      color: #0f172a;
    }

    .chat-message.other {
      align-self: flex-start;
    }

    .chat-message-meta {
      font-size: 10px;
      opacity: 0.8;
      margin-bottom: 2px;
    }

    .chat-message-text {
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .chat-attachments {
      min-height: 0;
      max-height: 56px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      font-size: 11px;
    }

    .chat-attachment-pill {
      border-radius: 999px;
      padding: 2px 7px;
      background: rgba(30, 64, 175, 0.25);
      border: 1px solid rgba(96, 165, 250, 0.5);
    }

    .chat-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-top: 2px;
    }

    .file-btn-label {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
    }

    .chat-input {
      flex: 1;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.96);
      padding: 6px 10px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    .chat-input::placeholder {
      color: rgba(148, 163, 184, 0.7);
    }

    .chat-send-btn {
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #facc15, #f97316);
      color: #0f172a;
      font-size: 13px;
      padding: 7px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .chat-send-btn span {
      font-size: 16px;
    }

    @media (max-width: 980px) {
      .app-main {
        grid-template-columns: 1fr;
      }

      .self-box {
        width: 60vw;
        max-width: 280px;
      }

      .invite-block {
        max-width: 100%;
      }
    }
  </style>
</head>

            <button id="copyInviteBtn">

            </button>
          </div>
        </div>
      </div>
    </header>
