<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebClass — Учитель</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(145deg, #0a0f25 0%, #111d45 50%, #2c2f7b 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #f9fafb;
        }

        .container {
            background: rgba(15, 23, 42, 0.96);
            padding: 22px 22px 26px;
            border-radius: 18px;
            box-shadow: 0 24px 50px rgba(0,0,0,0.55);
            width: 1180px;
            max-width: 96vw;
        }

        .top-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .link-block {
            flex: 1.5;
        }

        .link-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .link-title {
            font-size: 18px;
            font-weight: 600;
        }

        .link-toggle {
            font-size: 12px;
            color: #9ca3af;
            cursor: pointer;
            border: none;
            background: transparent;
            padding: 3px 6px;
            border-radius: 999px;
        }

        .link-toggle:hover {
            background: rgba(148,163,184,0.15);
        }

        .room-label {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 8px;
        }

        .link-content.hidden {
            display: none;
        }

        .link-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 4px;
        }

        input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #4b5563;
            font-size: 14px;
            background: #020617;
            color: #e5e7eb;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
        }

        button {
            padding: 10px 14px;
            border-radius: 10px;
            border: none;
            background-color: #4f46e5;
            color: white;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .2s, transform .05s;
        }

        button:hover {
            background-color: #4338ca;
            transform: translateY(-1px);
        }

        .hint {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 2px;
        }

        .teacher-info {
            flex: 1;
            font-size: 13px;
            color: #9ca3af;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            background: rgba(15,23,42,0.9);
        }

        .teacher-info b {
            color: #e5e7eb;
        }

        .bottom-row {
            display: flex;
            gap: 18px;
            align-items: stretch;
            margin-top: 4px;
        }

        /* ВИДЕО-СЕКЦИЯ СЛЕВА */
        .video-area {
            flex: 2.6;
            background: #020617;
            border-radius: 16px;
            padding: 14px;
            border: 1px solid #312e81;
            display: flex;
            flex-direction: column;
        }

        .room-title {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .video-wrapper {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            background: radial-gradient(circle at top, #1d4ed8, #020617 70%);
            padding: 12px;
            min-height: 420px;
        }

        .remote-box {
            border-radius: 12px;
            background: rgba(15,23,42,0.9);
            border: 1px solid rgba(129,140,248,0.5);
            height: 460px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e5e7eb;
            font-size: 14px;
            text-align: center;
            padding: 0;
            position: relative;
            overflow: hidden;
        }

        .remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #020617;
        }

        .remote-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            background: radial-gradient(circle at top, rgba(37,99,235,0.22), transparent 60%);
        }

        .remote-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            opacity: 0.8;
            margin-bottom: 6px;
        }

        .remote-name {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .remote-sub {
            font-size: 12px;
            color: #cbd5f5;
            max-width: 280px;
        }

        /* МАЛЕНЬКОЕ ОКНО УЧИТЕЛЯ */
        .self-box {
            position: absolute;
            right: 14px;
            bottom: 14px;
            width: 28%;
            min-width: 150px;
            border-radius: 10px;
            background: rgba(15,23,42,0.96);
            border: 1px solid rgba(148,163,184,0.85);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
            color: #e5e7eb;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .self-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            opacity: 0.9;
        }

        .self-tag {
            font-weight: 600;
        }

        .self-preview {
            margin-top: 4px;
            border-radius: 7px;
            background: linear-gradient(135deg, #1d4ed8, #22c55e);
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #f9fafb;
            text-align: center;
            overflow: hidden;
        }

        .self-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ЧАТ СПРАВА */
        .chat-panel {
            flex: 0.95;
            background: #020617;
            border-radius: 16px;
            border: 1px solid #1f2937;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .chat-title {
            font-size: 14px;
            font-weight: 500;
        }

        .chat-status {
            font-size: 11px;
            color: #9ca3af;
        }

        .chat-messages {
            flex: 1;
            background: #020617;
            border-radius: 10px;
            border: 1px solid #111827;
            padding: 8px;
            overflow-y: auto;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .chat-empty {
            font-size: 12px;
            color: #6b7280;
            text-align: center;
            margin-top: 18px;
        }

        .chat-input-row {
            display: flex;
            gap: 6px;
            margin-top: 2px;
            align-items: center;
        }

        .chat-input-row input {
            background: #020617;
            border-radius: 10px;
            border: 1px solid #374151;
            font-size: 13px;
            color: #e5e7eb;
            padding: 8px 10px;
        }

        .chat-input-row input::placeholder {
            color: #6b7280;
        }

        .chat-send-btn {
            background: #16a34a;
            font-size: 13px;
            padding: 8px 10px;
        }

        .chat-send-btn:hover {
            background: #15803d;
        }

        .chat-attach {
            width: 32px;
            height: 32px;
            border-radius: 999px;
            border: 1px solid #374151;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            background: #020617;
            color: #e5e7eb;
            flex-shrink: 0;
        }

        .chat-attach:hover {
            background: #111827;
        }

        .chat-note {
            font-size: 11px;
            color: #6b7280;
            margin-top: 2px;
        }

        .msg {
            margin-bottom: 6px;
            line-height: 1.35;
        }

        .msg-you {
            text-align: right;
        }

        .msg-author {
            font-size: 11px;
            opacity: 0.7;
        }

        .msg-bubble {
            display: inline-block;
            margin-top: 1px;
            padding: 6px 9px;
            border-radius: 9px;
            background: #111827;
        }

        .msg-you .msg-bubble {
            background: #1d4ed8;
        }

        @media (max-width: 900px) {
            .container {
                width: 100%;
                margin: 8px;
                padding: 14px;
            }
            .top-row {
                flex-direction: column;
            }
            .bottom-row {
                flex-direction: column;
            }
            .video-wrapper {
                min-height: 300px;
            }
            .remote-box {
                height: 320px;
            }
            .self-box {
                width: 36%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-row">
        <div class="link-block">
            <div class="link-header">
                <div class="link-title">Ссылка для ученика</div>
                <button id="toggleLink" class="link-toggle">Свернуть</button>
            </div>
            <div id="roomInfo" class="room-label"></div>

            <div id="linkContent" class="link-content">
                <div class="link-input-row">
                    <input id="lessonLink" type="text" readonly>
                    <button id="copyBtn">Скопировать</button>
                </div>
                <div class="hint">Скопируйте ссылку и отправьте её ученику в любой мессенджер.</div>
            </div>
        </div>

        <div class="teacher-info">
