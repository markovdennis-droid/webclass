<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Учитель — WebClass</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  padding: 20px;
  background: #020617;
  color: #e5e7eb;
  font-family: -apple-system,BlinkMacSystemFont,Roboto,sans-serif;
}
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.top-info {
  font-size: 14px;
}
.top-info b { font-weight: 600; }
.wrapper {
  display: flex;
  gap: 18px;
}
.col {
  flex: 1;
  background: #020617;
  border-radius: 16px;
  padding: 12px;
  box-shadow: 0 12px 30px rgba(15,23,42,0.8);
}
.col h3 {
  font-size: 14px;
  margin: 0 0 8px;
  color: #cbd5f5;
}
.video-box {
  background: #020617;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #1e293b;
}
video {
  width: 100%;
  height: 420px;
  background: #000;
  display: block;
}
#chat {
  height: 420px;
  background: radial-gradient(circle at top, #020617, #020617);
  border-radius: 14px;
  padding: 10px;
  font-size: 13px;
  overflow-y: auto;
  border: 1px solid #1f2937;
}
.msg-me { color: #a5b4fc; margin-bottom: 4px; }
.msg-other { color: #e5e7eb; margin-bottom: 4px; }
.chat-input {
  margin-top: 8px;
  display: flex;
  gap: 6px;
}
.chat-input input {
  flex: 1;
  padding: 8px 10px;
  border-radius: 999px;
  border: 1px solid #374151;
  background: #020617;
  color: #e5e7eb;
  outline: none;
  font-size: 13px;
}
.chat-input button {
  border-radius: 999px;
  border: none;
  padding: 8px 14px;
  background: #22c55e;
  color: #04101f;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.small-note {
  font-size: 12px;
  color: #9ca3af;
  margin-top: 4px;
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-info">
    Учитель: <b id="teacherName"></b><br>
    Комната: <b id="roomName"></b>
  </div>
  <div class="small-note">
    Сообщите код комнаты ученику: он введёт его на странице входа.
  </div>
</div>

<div class="wrapper">
  <div class="col">
    <h3>Вы (учитель)</h3>
    <div class="video-box">
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
  </div>

  <div class="col">
    <h3>Чат урока</h3>
    <div id="chat"></div>
    <div class="chat-input">
      <input id="msgInput" placeholder="Напишите сообщение...">
      <button onclick="sendMsg()">OK</button>
    </div>
  </div>

  <div class="col">
    <h3>Окно ученика</h3>
    <div class="video-box">
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const room   = params.get("room")  || "room_demo";
const name   = params.get("name")  || "Учитель";

document.getElementById("teacherName").textContent = name;
document.getElementById("roomName").textContent    = room;

const localVideo  = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");
const chatBox     = document.getElementById("chat");
const msgInput    = document.getElementById("msgInput");

const wsUrl = `wss://webclass-backend-g3uh.onrender.com/ws?room=${encodeURIComponent(room)}&role=teacher`;
const ws    = new WebSocket(wsUrl);

let pc = new RTCPeerConnection({
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    {
      urls: "turn:global.turn.twilio.com:3478?transport=udp",
      username: "demo",
      credential: "demo"
    }
  ]
});

pc.onicecandidate = (e) => {
  if (e.candidate) {
    ws.send(JSON.stringify({ type: "ice", candidate: e.candidate }));
  }
};

pc.ontrack = (e) => {
  remoteVideo.srcObject = e.streams[0];
};

(async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    localVideo.srcObject = stream;
    stream.getTracks().forEach(t => pc.addTrack(t, stream));
  } catch (err) {
    alert("Ошибка доступа к камере/микрофону: " + err);
  }
})();

ws.onmessage = async (event) => {
  const msg = JSON.parse(event.data);

  if (msg.chat) {
    const div = document.createElement("div");
    div.className = "msg-other";
    div.textContent = "Ученик: " + msg.chat;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return;
  }

  if (msg.type === "offer") {
    await pc.setRemoteDescription(msg);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    ws.send(JSON.stringify(answer));
  } else if (msg.type === "ice") {
    if (msg.candidate) {
      try {
        await pc.addIceCandidate(msg.candidate);
      } catch (e) {
        console.error("ICE error:", e);
      }
    }
  }
};

function sendMsg() {
  const text = msgInput.value.trim();
  if (!text) return;
  ws.send(JSON.stringify({ chat: text }));
  const div = document.createElement("div");
  div.className = "msg-me";
  div.textContent = "Вы: " + text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  msgInput.value = "";
}
</script>
</body>
</html>
