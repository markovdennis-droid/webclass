<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вебкласс — Учитель</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #eef2ff;
            color: #111827;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 4px;
            font-size: 24px;
        }

        .subtitle {
            margin-bottom: 4px;
            font-size: 16px;
        }

        .hello {
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: 500;
        }

        .status {
            margin-bottom: 4px;
            font-size: 15px;
        }

        .status span.label {
            font-weight: 600;
        }

        .status span.value {
            font-weight: 600;
        }

        .status-ok {
            color: #16a34a;
        }

        .status-wait {
            color: #f97316;
        }

        .status-error {
            color: #dc2626;
        }

        .debug {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 24px;
        }

        .video-box {
            background: #0f172a;
            border-radius: 18px;
            padding: 8px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.35);
            display: flex;
            flex-direction: column;
        }

        .video-title {
            color: #e5e7eb;
            font-size: 14px;
            margin-bottom: 4px;
            padding: 0 4px;
        }

        video {
            width: 100%;
            border-radius: 14px;
            background: #020617;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <h1>Комната преподавателя</h1>
    <div class="subtitle">Видеозвонок и общение с учениками</div>
    <div class="hello" id="helloText">Здравствуйте!</div>

    <div class="status">
        <span class="label">Статус:</span>
        <span id="statusText" class="value status-wait">подключаемся…</span>
    </div>
    <div id="debugText" class="debug">ICE: -, PC: -</div>

    <div class="grid">
        <div class="video-box">
            <div class="video-title">Моё видео</div>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div class="video-box">
            <div class="video-title">Видео ученика</div>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>
</div>

<script>
    const ROLE = "teacher";
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name") || "Учитель";
    const room = params.get("room") || "default";

    document.getElementById("helloText").textContent = `Здравствуйте, ${name.toUpperCase()}!`;

    const statusText = document.getElementById("statusText");
    const debugText = document.getElementById("debugText");

    function setStatus(text, type = "wait") {
        statusText.textContent = text;
        statusText.classList.remove("status-ok", "status-wait", "status-error");
        if (type === "ok") statusText.classList.add("status-ok");
        else if (type === "error") statusText.classList.add("status-error");
        else statusText.classList.add("status-wait");
    }

    function setDebug(ice, pc) {
        debugText.textContent = `ICE: ${ice} | PC: ${pc}`;
    }

    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");

    let localStream = null;
    let pc = null;
    let ws = null;
    let hasRemoteStream = false;

    async function initMedia() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: true
            });
            localVideo.srcObject = localStream;
        } catch (err) {
            console.error("Ошибка доступа к камере/микрофону:", err);
            setStatus("нет доступа к камере/микрофону", "error");
            throw err;
        }
    }

    function createPeerConnection() {
        const config = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: ["stun:fr-turn4.xirsys.com"] },
                {
                    username: "SbW8Rnpqh1htOMYUh2YIoB67iO9KSTyAFc55y_yISl2exds__kZpJxVzcjElsxBKAAAAAGkjfIpkZW5uaXNNYXJrb3Y=",
                    credential: "625c7f26-c8b3-11f0-9366-5ec4b59bd929",
                    urls: [
                        "turn:fr-turn4.xirsys.com:80?transport=udp",
                        "turn:fr-turn4.xirsys.com:3478?transport=udp",
                        "turn:fr-turn4.xirsys.com:80?transport=tcp",
                        "turn:fr-turn4.xirsys.com:3478?transport=tcp",
                        "turns:fr-turn4.xirsys.com:443?transport=tcp",
                        "turns:fr-turn4.xirsys.com:5349?transport=tcp"
                    ]
                }
            ],
            iceTransportPolicy: "relay"   // <--- только через TURN/STUN
        };

        pc = new RTCPeerConnection(config);
        setDebug(pc.iceConnectionState, pc.connectionState);

        if (localStream) {
            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
            });
        }

        pc.onicecandidate = event => {
            if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "ice-candidate",
                    room,
                    role: ROLE,
                    candidate: event.candidate
                }));
            }
        };

        pc.ontrack = event => {
            if (!hasRemoteStream) {
                hasRemoteStream = true;
                setStatus("ученик на связи", "ok");
            }
            remoteVideo.srcObject = event.streams[0];
        };

        pc.oniceconnectionstatechange = () => {
            setDebug(pc.iceConnectionState, pc.connectionState);
            console.log("ICE state:", pc.iceConnectionState);
        };

        pc.onconnectionstatechange = () => {
            setDebug(pc.iceConnectionState, pc.connectionState);
            console.log("PC state:", pc.connectionState);
            if (pc.connectionState === "connected") {
                setStatus("соединение установлено", "ok");
            } else if (pc.connectionState === "failed") {
                setStatus("соединение WebRTC оборвалось", "error");
            }
        };
    }

    async function createOfferAndSend() {
        if (!pc) createPeerConnection();
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        ws.send(JSON.stringify({
            type: "offer",
            room,
            role: ROLE,
            offer
        }));
        setStatus("отправили приглашение ученику…", "wait");
    }

    async function handleOffer(offer) {
        if (!pc) createPeerConnection();
        await pc.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({
            type: "answer",
            room,
            role: ROLE,
            answer
        }));
        setStatus("отправили ответ…", "wait");
    }

    async function handleAnswer(answer) {
        if (!pc) return;
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
        setStatus("соединяемся с учеником…", "wait");
    }

    async function handleIceCandidate(candidate) {
        if (!pc) createPeerConnection();
        try {
            await pc.addIceCandidate(new RTCIceCandidate(candidate));
        } catch (err) {
            console.error("Ошибка ICE:", err);
        }
    }

    function connectWebSocket() {
        setStatus("подключаемся к серверу…", "wait");

        ws = new WebSocket("wss://webclass-backend-g3uh.onrender.com/ws");

        ws.onopen = () => {
            console.log("WS open");
            setStatus("соединение с сервером установлено, ждём ученика…", "wait");
            ws.send(JSON.stringify({
                type: "join",
                room,
                role: ROLE,
                name
            }));
        };

        ws.onmessage = async (event) => {
            const msg = JSON.parse(event.data);
            console.log("WS message:", msg);

            switch (msg.type) {
                case "joined":
                    await createOfferAndSend();
                    break;

                case "offer":
                    if (msg.role !== ROLE && msg.offer) {
                        await handleOffer(msg.offer);
                    }
                    break;

                case "answer":
                    if (msg.role !== ROLE && msg.answer) {
                        await handleAnswer(msg.answer);
                    }
                    break;

                case "ice-candidate":
                    if (msg.role !== ROLE && msg.candidate) {
                        await handleIceCandidate(msg.candidate);
                    }
                    break;

                case "info":
                    setStatus(msg.text || "сообщение сервера", "wait");
                    break;
            }
        };

        ws.onerror = (err) => {
            console.error("WS error:", err);
            setStatus("ошибка соединения с сервером", "error");
        };

        ws.onclose = () => {
            console.log("WS closed");
            if (!hasRemoteStream) {
                setStatus("соединение с сервером закрыто", "error");
            }
        };
    }

    (async () => {
        try {
            await initMedia();
            createPeerConnection();
            connectWebSocket();
        } catch (e) {
            console.error(e);
        }
    })();
</script>
</body>
</html>
