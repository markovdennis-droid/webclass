<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>WebClass — Учитель</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg-main: #050816;
      --bg-panel: #0b1020;
      --bg-panel-soft: #11172b;
      --accent: #4f46e5;
      --accent-soft: rgba(79, 70, 229, 0.25);
      --text-main: #f9fafb;
      --text-dim: #9ca3af;
      --danger: #ef4444;
      --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.95);
      --shadow-pip: 0 16px 40px rgba(15, 23, 42, 1);
      --border-soft: 1px solid rgba(148, 163, 184, 0.4);
      --radius-lg: 18px;
      --radius-xl: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top, #1f2937 0, #020617 52%, #000 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 1320px;
      margin: 10px auto;
      padding: 10px 10px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #facc15 0, #f97316 32%, #111827 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #0f172a;
      box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.6),
        0 12px 35px rgba(250, 204, 21, 0.9);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-text strong {
      font-size: 15px;
    }

    .brand-text span {
      font-size: 12px;
      color: var(--text-dim);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: flex-end;
      flex: 1;
      min-width: 260px;
    }

    .invite-block {
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.7);
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .invite-title {
      font-size: 12px;
      color: var(--text-dim);
    }

    .invite-url-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #inviteUrl {
      font-size: 12px;
      word-break: break-all;
      color: #e5e7eb;
      padding: 4px 6px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.6);
      flex: 1;
    }

    #copyInviteBtn {
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #e5e7eb;
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    #copyInviteBtn span {
      font-size: 14px;
    }

    .app-main {
      display: grid;
      grid-template-columns: minmax(0, 2.1fr) minmax(0, 1fr);
      gap: 14px;
      align-items: stretch;
    }

    .video-panel {
      position: relative;
      border-radius: var(--radius-xl);
      background: radial-gradient(circle at top left, rgba(96, 165, 250, 0.22), transparent 55%),
        radial-gradient(circle at bottom right, rgba(250, 204, 21, 0.28), transparent 60%),
        var(--bg-panel);
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(148, 163, 184, 0.48);
      padding: 10px 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }

    .video-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: default;
      user-select: none;
      padding: 4px 4px 4px 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(15, 23, 42, 0.9), rgba(17, 24, 39, 0.88));
      border: 1px solid rgba(148, 163, 184, 0.5);
    }

    .video-header-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.3);
    }

    .video-header-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .video-header-text strong {
      font-size: 13px;
    }

    .video-header-text span {
      font-size: 11px;
      color: var(--text-dim);
    }

    .video-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .fs-btn,
    .swap-btn {
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      font-size: 12px;
      cursor: pointer;
      padding: 4px 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .fs-btn-icon {
      font-size: 16px;
    }

    .video-body {
      position: relative;
      border-radius: 18px;
      padding: 8px;
      background:
        radial-gradient(circle at top left, rgba(96, 165, 250, 0.2), transparent 55%),
        radial-gradient(circle at bottom right, rgba(250, 204, 21, 0.22), transparent 60%),
        #020617;
      border: 1px solid rgba(148, 163, 184, 0.5);
      box-shadow: var(--shadow-soft);
    }

    .main-video-wrapper {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
    }

    #mainVideo {
      width: 100%;
      display: block;
      border-radius: 14px;
      background: #000;
      aspect-ratio: 16/9;
      object-fit: cover;
    }

    .self-box {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 26vw;
      max-width: 260px;
      min-width: 180px;
      background: radial-gradient(circle at top, rgba(250, 204, 21, 0.2), transparent 60%),
        #020617;
      border-radius: 16px;
      border: 1px solid rgba(250, 204, 21, 0.8);
      box-shadow: var(--shadow-pip);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .self-box.hidden {
      display: none;
    }

    .self-box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 7px;
      font-size: 11px;
      background: linear-gradient(90deg, rgba(15, 23, 42, 0.96), rgba(234, 179, 8, 0.95));
      border-bottom: 1px solid rgba(250, 204, 21, 0.75);
      user-select: none;
    }

    #selfVideo {
      width: 100%;
      display: block;
      background: #020617;
      aspect-ratio: 4/3;
      object-fit: cover;
    }

    .self-box-footer {
      padding: 4px 6px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: linear-gradient(90deg, rgba(15, 23, 42, 0.96), rgba(234, 179, 8, 0.94));
      border-top: 1px solid rgba(250, 204, 21, 0.7);
    }

    .pill-btn {
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.65);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pill-btn .dot-mic {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.35);
    }

    .pill-btn.muted .dot-mic {
      background: #ef4444;
      box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.35);
    }

    .toggle-self-btn {
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.92);
      color: #e5e7eb;
      font-size: 11px;
      padding: 3px 6px;
      cursor: pointer;
    }

    .fs-hint {
      margin-top: 4px;
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-kbd {
      padding: 2px 5px;
      border-radius: 4px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      font-size: 10px;
      background: rgba(15, 23, 42, 0.95);
    }

    .side-panel {
      position: relative;
      border-radius: var(--radius-xl);
      background: var(--bg-panel-soft);
      border: 1px solid rgba(148, 163, 184, 0.28);
      box-shadow: var(--shadow-soft);
      padding: 10px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .side-header {
      display: flex;
      flex-direction: column;
      gap: 2px;
      user-select: none;
      padding: 4px 6px;
      border-radius: 10px;
      background: linear-gradient(90deg, rgba(15, 23, 42, 0.94), rgba(17, 24, 39, 0.88));
      border: 1px solid rgba(148, 163, 184, 0.5);
    }

    .side-header h2 {
      font-size: 13px;
      margin: 0;
    }

    .side-header span {
      font-size: 11px;
      color: var(--text-dim);
    }

    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.92));
      border: 1px solid rgba(148, 163, 184, 0.45);
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.95);
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      padding: 10px 10px 6px;
      overflow-y: auto;
      font-size: 13px;
    }

    .chat-message {
      margin-bottom: 8px;
      padding: 7px 8px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.5);
    }

    .chat-message.me {
      background: radial-gradient(circle at top left, rgba(250, 204, 21, 0.36), rgba(17, 24, 39, 0.95));
      border-color: rgba(250, 204, 21, 0.85);
    }

    .chat-message-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 2px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .chat-message-body {
      font-size: 13px;
    }

    .chat-attachments {
      padding: 4px 8px;
      border-top: 1px solid rgba(148, 163, 184, 0.35);
      min-height: 0;
    }

    .chat-attachment-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin: 2px;
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(250, 204, 21, 0.2);
      border: 1px solid rgba(250, 204, 21, 0.7);
      font-size: 11px;
      color: #fefce8;
    }

    .chat-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px 8px;
      border-top: 1px solid rgba(148, 163, 184, 0.45);
      background: rgba(15, 23, 42, 0.98);
    }

    .file-btn-label {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
    }

    .chat-input {
      flex: 1;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.96);
      padding: 6px 10px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    .chat-input::placeholder {
      color: rgba(148, 163, 184, 0.7);
    }

    .chat-send-btn {
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #facc15, #f97316);
      color: #0f172a;
      font-size: 13px;
      padding: 7px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .chat-send-btn span {
      font-size: 16px;
    }

    @media (max-width: 980px) {
      .app-main {
        grid-template-columns: 1fr;
      }

      .self-box {
        width: 60vw;
        max-width: 280px;
      }

      .invite-block {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <header>
      <div class="brand-block">
        <div class="brand-logo">T</div>
        <div class="brand-text">
          <strong>WebClass • Teacher</strong>
          <span>Кабинет учителя · видеокласс</span>
        </div>
      </div>

      <div class="header-actions">
        <div class="invite-block">
          <div class="invite-title">Ссылка для ученика</div>
          <div class="invite-url-row">
            <div id="inviteUrl">…</div>
            <button id="copyInviteBtn">
              <span>📋</span> Скопировать
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section class="video-panel" id="videoPanel">
        <div class="video-header">
          <div class="video-header-left">
            <div class="status-dot"></div>
            <div class="video-header-text">
              <strong>Ваш студент</strong>
              <span>Онлайн-видеосвязь</span>
            </div>
          </div>
          <div class="video-header-actions">
            <button class="swap-btn" id="swapBtn">↔ Поменять местами</button>
            <button class="fs-btn" id="fullscreenBtn">
              <span class="fs-btn-icon" id="fsIcon">⛶</span> На весь экран
            </button>
          </div>
        </div>

        <div class="video-body" id="mainVideoWrapper">
          <div class="main-video-wrapper">
            <video id="mainVideo" autoplay playsinline></video>

            <div class="self-box" id="selfBox">
              <div class="self-box-header">
                <span>Вы</span>
                <span style="opacity:0.75;">PiP</span>
              </div>
              <video id="selfVideo" autoplay playsinline muted></video>
              <div class="self-box-footer">
                <button class="pill-btn" id="micToggleBtn">
                  <span class="dot-mic"></span> Микрофон
                </button>
                <button class="toggle-self-btn" id="toggleSelfBtn">
                  🙈 Скрыть
                </button>
              </div>
            </div>
          </div>
          <div class="fs-hint">
            <span class="icon-kbd">Esc</span>
            <span>— выход из полноэкранного режима</span>
          </div>
        </div>
      </section>

      <aside class="side-panel" id="sidePanel">
        <div class="side-header">
          <h2>Чат урока</h2>
          <span>Локальный чат (заметки учителя)</span>
        </div>

        <div class="chat-panel">
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-attachments" id="chatAttachments"></div>
          <div class="chat-footer">
            <label class="file-btn-label" for="chatFileInput">📎</label>
            <input type="file" id="chatFileInput" multiple style="display:none;" />
            <input
              type="text"
              id="chatInput"
              class="chat-input"
              placeholder="Написать заметку к уроку..."
            />
            <button class="chat-send-btn" id="chatSendBtn">
              <span>➤</span> Отпр.
            </button>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <!-- WebRTC + генерация ссылки + локальный чат -->
  <script>
  (function () {
    const ROLE = "teacher";
    const params = new URLSearchParams(window.location.search);
    const roomId = params.get("room") || "default-room";

    // 1) Генерация ссылки для ученика
    const inviteEl = document.getElementById("inviteUrl");
    const copyBtn = document.getElementById("copyInviteBtn");
    if (inviteEl) {
      const origin = window.location.origin;
      const studentUrl = `${origin}/student.html?room=${encodeURIComponent(roomId)}`;
      inviteEl.textContent = studentUrl;

      if (copyBtn) {
        copyBtn.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(studentUrl);
            const old = copyBtn.innerHTML;
            copyBtn.innerHTML = "<span>✔</span> Скопировано";
            setTimeout(() => (copyBtn.innerHTML = old), 1200);
          } catch {
            alert("Не удалось скопировать ссылку");
          }
        });
      }
    }

    // 2) WebRTC
    const signalingUrl = `wss://webclass-backend-g3uh.onrender.com/ws/${roomId}`;
    const selfVideo = document.getElementById("selfVideo");
    const mainVideo = document.getElementById("mainVideo");

    if (!selfVideo || !mainVideo) {
      console.warn("WebRTC: не найдены элементы selfVideo/mainVideo");
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert("Ваш браузер не поддерживает видеосвязь (getUserMedia).");
      return;
    }

    let localStream = null;
    let remoteStream = null;
    let pc = null;
    let ws = null;

    const statusEl = createStatusBadge("teacher");
    status("init");

    start();

    async function start() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });
        selfVideo.srcObject = localStream;
        status("local-stream");
      } catch (err) {
        console.error("gUM error:", err);
        alert("Не удалось получить доступ к камере/микрофону.");
        status("gUM-error");
        return;
      }
      setupWebSocket();
    }

    function setupWebSocket() {
      try {
        ws = new WebSocket(signalingUrl);
        status("ws-connecting");
      } catch (err) {
        console.error("WS create error:", err);
        status("ws-error");
        return;
      }

      ws.onopen = () => {
        console.log("WS open (teacher), room =", roomId);
        status("ws-open");
        send({ type: "ready", role: ROLE });
      };

      ws.onmessage = async (event) => {
        let msg;
        try {
          msg = JSON.parse(event.data);
        } catch {
          return;
        }

        if (msg.role === ROLE) return;
        console.log("[teacher] msg:", msg.type);

        switch (msg.type) {
          case "ready":
            // ученик подключился, инициируем звонок
            await ensurePeerConnection();
            await makeOffer();
            break;

          case "offer":
            await ensurePeerConnection();
            await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            send({ type: "answer", sdp: pc.localDescription, role: ROLE });
            status("answer-sent");
            break;

          case "answer":
            if (!pc) return;
            await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
            status("answer-set");
            break;

          case "candidate":
            if (!pc || !msg.candidate) return;
            try {
              await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
              status("candidate-add");
            } catch (err) {
              console.warn("addIceCandidate error:", err);
            }
            break;
        }
      };

      ws.onclose = () => {
        console.log("WS closed (teacher)");
        status("ws-closed");
      };

      ws.onerror = (err) => {
        console.error("WS error (teacher):", err);
        status("ws-error");
      };
    }

    function send(payload) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(payload));
      }
    }

    async function ensurePeerConnection() {
      if (pc) return;
      status("pc-creating");

      pc = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
      });

      if (localStream) {
        localStream.getTracks().forEach((track) => {
          pc.addTrack(track, localStream);
        });
      }

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          send({
            type: "candidate",
            candidate: event.candidate,
            role: ROLE
          });
        }
      };

      pc.ontrack = (event) => {
        const stream = event.streams[0];
        console.log("[teacher] ontrack", stream);
        if (!remoteStream) {
          remoteStream = new MediaStream();
          mainVideo.srcObject = remoteStream; // сюда придёт ученик
        }
        stream.getTracks().forEach((track) => {
          remoteStream.addTrack(track);
        });
        status("remote-track");
      };
    }

    async function makeOffer() {
      if (!pc) return;
      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        send({ type: "offer", sdp: pc.localDescription, role: ROLE });
        status("offer-sent");
      } catch (err) {
        console.error("offer error:", err);
        status("offer-error");
      }
    }

    function createStatusBadge(label) {
      const el = document.createElement("div");
      el.style.position = "fixed";
      el.style.left = "8px";
      el.style.bottom = "8px";
      el.style.zIndex = "9999";
      el.style.fontSize = "10px";
      el.style.padding = "3px 6px";
      el.style.borderRadius = "999px";
      el.style.background = "rgba(15,23,42,0.9)";
      el.style.border = "1px solid rgba(148,163,184,.6)";
      el.style.color = "#e5e7eb";
      el.textContent = label + ": …";
      document.body.appendChild(el);
      return el;
    }

    function status(code) {
      if (statusEl) statusEl.textContent = "teacher: " + code;
    }

    // 3) Локальный чат
    const input = document.getElementById("chatInput");
    const sendBtn = document.getElementById("chatSendBtn");
    const messages = document.getElementById("chatMessages");
    const attachBox = document.getElementById("chatAttachments");
    const fileInput = document.getElementById("chatFileInput");

    if (input && sendBtn && messages) {
      let pendingFiles = [];

      if (fileInput) {
        fileInput.addEventListener("change", () => {
          pendingFiles = Array.from(fileInput.files || []);
          renderAttachments();
        });
      }

      function renderAttachments() {
        if (!attachBox) return;
        attachBox.innerHTML = "";
        pendingFiles.forEach((f) => {
          const pill = document.createElement("div");
          pill.className = "chat-attachment-pill";
          pill.textContent = "📎 " + f.name;
          attachBox.appendChild(pill);
        });
      }

      function addMessage(text, from = "Вы") {
        const wrap = document.createElement("div");
        wrap.className = "chat-message me";

        const header = document.createElement("div");
        header.className = "chat-message-header";
        const time = new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });
        header.innerHTML = `<span>${from}</span><span>${time}</span>`;
        wrap.appendChild(header);

        if (text) {
          const body = document.createElement("div");
          body.className = "chat-message-body";
          body.textContent = text;
          wrap.appendChild(body);
        }

        pendingFiles.forEach((f) => {
          const pill = document.createElement("div");
          pill.className = "chat-attachment-pill";
          pill.textContent = "📎 " + f.name;
          wrap.appendChild(pill);
        });

        messages.appendChild(wrap);
        messages.scrollTop = messages.scrollHeight;
      }

      function sendMsg() {
        const text = input.value.trim();
        if (!text && pendingFiles.length === 0) return;
        addMessage(text);
        input.value = "";
        pendingFiles = [];
        if (fileInput) fileInput.value = "";
        renderAttachments();
      }

      sendBtn.addEventListener("click", sendMsg);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMsg();
        }
      });
    }
  })();
  </script>
</body>
</html>
