<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вебкласс — Учитель</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #eef2ff;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 16px 24px;
        }
        header {
            margin-bottom: 12px;
        }
        h1 {
            font-size: 22px;
            margin: 0;
        }
        .subtitle {
            font-size: 13px;
            color: #6b7280;
        }
        #welcome {
            margin-top: 6px;
            font-size: 14px;
            font-weight: 500;
        }
        iframe {
            width: 100%;
            height: 75vh;
            border: 0;
            border-radius: 14px;
            overflow: hidden;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Комната преподавателя</h1>
        <div class="subtitle">Видеозвонок и общение с учениками</div>
        <p id="welcome"></p>
    </header>

    <iframe id="videoFrame" allow="camera; microphone; fullscreen; display-capture"></iframe>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name") || "Учитель";
    const room = params.get("room") || "default-room";

    document.getElementById("welcome").innerText = "Здравствуйте, " + name + "!";

    // Генерируем ссылку на видеокомнату
    const link = "https://meet.jit.si/WebClassRoom_" + encodeURIComponent(room);

    document.getElementById("videoFrame").src = link;
</script>
</body>
</html>
