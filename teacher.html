<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebClass • Учитель</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    <div class="header-title">WebClass • Teacher</div>

    <div class="link-box">
        <span id="studentLink">Ссылка для ученика: ...</span>
        <button class="copy-btn" onclick="copyLink()">Копировать</button>
    </div>

    <button class="copy-btn" onclick="toggleNight()">🌙</button>
</div>

<div class="container">
    <div class="main-video">
        <div class="video-box" id="remoteVideoBox">
            <video id="remoteVideo" autoplay playsinline></video>

            <div id="localVideoWrap">
                <div class="small-controls">
                    <button class="ctrl-btn" onclick="swap()">⇅</button>
                    <button class="ctrl-btn" onclick="hideSelf()">🙈</button>
                    <button class="ctrl-btn" onclick="fullscreen()">⛶</button>
                </div>

                <video id="localVideo" autoplay muted playsinline></video>
            </div>

        </div>
    </div>

    <div class="chat-panel">
        <div class="messages" id="messages"></div>

        <div class="chat-input">
            <input type="file" id="fileInput" style="display:none">
            <button class="send-btn" onclick="pickFile()">📎</button>

            <input type="text" id="msg" placeholder="Сообщение...">
            <button class="send-btn" onclick="sendMsg()">➤</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
