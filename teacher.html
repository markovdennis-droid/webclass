<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebClass — Учитель</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #EEF2FF; /* Светлый фон как на стартовой странице */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.1);
            width: 380px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 14px;
        }

        button {
            width: 100%;
            background-color: #3b82f6;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: background .2s;
        }

        button:hover {
            background-color: #2563eb;
        }

        .link-field {
            margin-top: 18px;
            font-size: 14px;
            color: #444;
            text-align: left;
            user-select: all;
            cursor: pointer;
            background: #f7f7f7;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #d4d4d4;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ссылка на урок</h2>

    <input id="lessonLink" type="text" readonly>
    <button id="copyBtn">Скопировать ссылку</button>

    <div id="clickSelect" class="link-field"></div>
</div>

<script>
    const link = `${window.location.origin}/student.html`;
    const input = document.getElementById("lessonLink");
    const field = document.getElementById("clickSelect");
    const btn = document.getElementById("copyBtn");

    input.value = link;
    field.textContent = link;

    // при клике — выделить
    field.onclick = function () {
        const range = document.createRange();
        range.selectNode(field);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
    };

    btn.onclick = function () {
        navigator.clipboard.writeText(link).then(() => {
            btn.textContent = "Скопировано ✓";
            btn.style.backgroundColor = "#16a34a";

            setTimeout(() => {
                btn.textContent = "Скопировать ссылку";
                btn.style.backgroundColor = "#3b82f6";
            }, 2000);
        });
    };
</script>

</body>
</html>
