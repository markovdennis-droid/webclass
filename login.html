<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WebClass — вход</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #eef1ff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 360px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.15);
            text-align: center;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button {
            padding: 12px 25px;
            background: #3b5bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #2e46d9; }
    </style>
</head>

<body>
<div class="card">
    <h2>WebClass</h2>
    <p>Введите ваше имя</p>

    <input id="teacherName" placeholder="Ваше имя (например: Денис)">

    <button onclick="startLesson()">Начать урок</button>
</div>

<script>
    function generateRoomID() {
        return "room_" + Math.random().toString(36).substring(2, 10);
    }

    function startLesson() {
        let name = document.getElementById("teacherName").value.trim();
        if (!name) {
            alert("Введите имя!");
            return;
        }

        const room = generateRoomID();
        window.location.href = `teacher.html?name=${encodeURIComponent(name)}&room=${room}`;
    }
</script>

</body>
</html>
