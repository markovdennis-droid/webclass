<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход для учителей – WebClass</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: radial-gradient(circle at top, #4f46e5 0, #0f172a 55%, #020617 100%);
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: rgba(15, 23, 42, 0.8);
            padding: 32px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-size: 14px;
            color: #cbd5f6;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 15px;
        }

        .btn {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 24px;
            padding: 12px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(99,102,241,0.6);
            transition: 0.15s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .link {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .link a {
            color: #c7d2fe;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Вход для учителей</h2>

    <label>Email</label>
    <input type="email" id="email" placeholder="teacher@example.com">

    <label>Пароль</label>
    <input type="password" id="password" placeholder="Введите пароль">

    <a href="#" class="btn">Войти</a>

    <div class="link">
        Нет аккаунта? <a href="register.html">Создать</a>
    </div>
</div>

</body>
</html>
