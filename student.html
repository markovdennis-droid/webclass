
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>WebClass — Ученик</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg-main: #050816;
      --bg-panel: #0b1020;
      --bg-panel-soft: #11172b;
      --accent: #4f46e5;
      --accent-soft: rgba(79, 70, 229, 0.25);
      --text-main: #f9fafb;
      --text-dim: #9ca3af;
      --danger: #ef4444;
      --radius-lg: 18px;
      --radius-xl: 22px;
      --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.55);
      --shadow-pip: 0 16px 40px rgba(0, 0, 0, 0.65);
      --border-soft: 1px solid rgba(148, 163, 184, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top, #1f2937 0, #020617 52%, #000 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 1320px;
      margin: 10px auto;
      padding: 10px 10px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.86));
      box-shadow: 0 10px 32px rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.35);
      backdrop-filter: blur(18px);
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #a5b4fc 0, #4f46e5 32%, #111827 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #e5e7eb;
      box-shadow: 0 0 0 1px rgba(129, 140, 248, 0.6),
        0 12px 35px rgba(79, 70, 229, 0.9);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-text strong {
      font-size: 15px;
      letter-spacing: 0.03em;
    }

    .brand-text span {
      font-size: 12px;
      color: var(--text-dim);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      border: 1px solid rgba(52, 211, 153, 0.8);
      color: #bbf7d0;
      background: linear-gradient(135deg, rgba(22, 163, 74, 0.12), rgba(5, 46, 22, 0.85));
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.28);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .main-layout {
      display: grid;
      grid-template-columns: minmax(0, 2.1fr) minmax(0, 1fr);
      gap: 14px;
    }

    .dragging {
      cursor: grabbing !important;
    }

    .video-panel {
      position: relative;
      border-radius: var(--radius-xl);
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.12), transparent 55%),
        radial-gradient(circle at bottom right, rgba(129, 140, 248, 0.2), transparent 60%),
        var(--bg-panel);
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(148, 163, 184, 0.25);
      overflow: hidden;
      padding: 12px;
    }

    .video-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      cursor: grab;
      user-select: none;
    }

    .video-panel-header span {
      font-size: 12px;
      color: var(--text-dim);
    }

    .main-video-wrapper {
      position: relative;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      background: radial-gradient(circle at center, #111827 0, #020617 70%);
      box-shadow: 0 18px 44px rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(15, 23, 42, 0.9);
    }

    .main-video {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .main-video-controls {
      position: absolute;
      inset: 10px 10px auto auto;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .control-chip {
      pointer-events: auto;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.92);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.9);
    }

    .fs-btn {
      pointer-events: auto;
      border: none;
      outline: none;
      border-radius: 999px;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      font-size: 14px;
      transition: transform 0.08s ease, box-shadow 0.14s ease,
        background 0.16s ease;
      border: 1px solid rgba(148, 163, 184, 0.55);
    }

    .fs-btn:hover {
      transform: translateY(-1px) scale(1.03);
      box-shadow: 0 15px 32px rgba(59, 130, 246, 0.75);
      background: rgba(30, 64, 175, 0.96);
    }

    .fs-btn:active {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.9);
    }

    .fs-btn-icon {
      display: inline-block;
      transform-origin: center;
      font-size: 16px;
    }

    .side-panel {
      position: relative;
      border-radius: var(--radius-xl);
      background: var(--bg-panel-soft);
      border: 1px solid rgba(148, 163, 184, 0.28);
      box-shadow: var(--shadow-soft);
      padding: 10px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .side-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      cursor: grab;
      user-select: none;
    }

    .side-header h2 {
      font-size: 13px;
    }

    .side-header span {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 400;
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-radius: 13px;
      border: 1px dashed rgba(148, 163, 184, 0.45);
      padding: 8px;
      background: radial-gradient(circle at top left, rgba(30, 64, 175, 0.14), transparent 55%),
        radial-gradient(circle at bottom right, rgba(8, 47, 73, 0.26), transparent 55%),
        rgba(15, 23, 42, 0.78);
      height: 260px;
      max-height: 320px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .chat-message {
      padding: 4px 6px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.4);
      max-width: 100%;
      word-wrap: break-word;
    }

    .chat-message.me {
      background: rgba(37, 99, 235, 0.2);
      border-color: rgba(96, 165, 250, 0.8);
      align-self: flex-end;
    }

    .chat-message-header {
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 2px;
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }

    .chat-attachments {
      font-size: 10px;
      color: var(--text-dim);
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .chat-attachment-pill {
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.9);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .chat-input {
      flex: 1;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.95);
      color: var(--text-main);
      padding: 6px 10px;
      font-size: 12px;
      outline: none;
    }

    .chat-input::placeholder {
      color: rgba(148, 163, 184, 0.8);
    }

    .file-btn-label {
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      padding: 4px 8px;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.95);
    }

    .send-btn {
      border-radius: 999px;
      border: 1px solid rgba(96, 165, 250, 0.8);
      padding: 5px 10px;
      font-size: 13px;
      cursor: pointer;
      background: rgba(37, 99, 235, 0.9);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.6);
    }

    .send-btn:active {
      transform: translateY(1px);
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.6);
    }

    .side-panel-footer {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .small-pill {
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: var(--text-dim);
    }

    .resize-handle {
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: radial-gradient(circle at 0 0, rgba(148, 163, 184, 0.6), transparent 65%);
      cursor: se-resize;
      opacity: 0.8;
    }

    .resize-handle::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.7);
      border-right: 1px solid rgba(148, 163, 184, 0.7);
      border-radius: 3px;
      opacity: 0.9;
    }

    /* PIP */
    .self-box {
      position: fixed;
      right: 2.2vw;
      bottom: 2.2vh;
      width: 40vw;
      max-width: 420px;
      border-radius: var(--radius-xl);
      background: radial-gradient(circle at top left, rgba(248, 250, 252, 0.02), transparent 55%),
        rgba(5, 10, 25, 0.96);
      box-shadow: var(--shadow-pip);
      border: 1px solid rgba(148, 163, 184, 0.55);
      padding: 8px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 70;
      backdrop-filter: blur(12px);
      cursor: grab;
    }

    .self-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      user-select: none;
    }

    .self-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .self-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.28);
    }

    .self-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .swap-btn {
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      font-size: 11px;
      padding: 3px 7px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: background 0.16s ease, transform 0.08s ease,
        box-shadow 0.16s ease;
    }

    .swap-btn:hover {
      background: rgba(30, 64, 175, 0.95);
      box-shadow: 0 6px 18px rgba(59, 130, 246, 0.65);
      transform: translateY(-0.5px);
    }

    .self-video-frame {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: radial-gradient(circle at center, #020617 0, #000 70%);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(15, 23, 42, 0.9);
    }

    .self-video {
      width: 100%;
      display: block;
      background: #000;
      object-fit: cover;
      aspect-ratio: 16 / 9;
    }

    .self-overlay {
      position: absolute;
      inset: auto 8px 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      pointer-events: none;
    }

    .self-label {
      pointer-events: auto;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.6);
      color: var(--text-dim);
    }

    .mute-pill {
      pointer-events: auto;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.6);
      color: #fee2e2;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .mute-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--danger);
    }

    .self-box.hidden .self-video-frame {
      display: none;
    }

    .self-box.hidden {
      padding-bottom: 6px;
    }

    .fullscreen-active {
      background: #000;
    }

    @media (max-width: 900px) {
      .app-shell {
        padding: 10px 8px 18px;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .main-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .self-box {
        right: 4vw;
        bottom: 4vh;
        width: 60vw;
        max-width: 60vw;
        padding: 7px 8px 9px;
      }

      .main-video-wrapper {
        border-radius: 18px;
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 9px 10px;
      }

      .main-video-controls {
        inset: 8px 8px auto auto;
      }

      .fs-btn {
        width: 28px;
        height: 28px;
      }

      .self-box {
        right: 3vw;
        bottom: 3vh;
        width: 60vw;
        max-width: 60vw;
      }

      .self-label,
      .mute-pill {
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="brand-block">
        <div class="brand-logo">W</div>
        <div class="brand-text">
          <strong>WebClass • Student</strong>
          <span>Кабинет ученика · подключение к учителю</span>
        </div>
      </div>
      <div class="header-actions">
        <div class="status-pill">
          <span class="status-dot"></span>
          <span>Подключено</span>
        </div>
      </div>
    </header>

    <main>
      <div class="main-layout">
        <section class="video-panel" id="videoPanel">
          <div class="video-panel-header" id="videoPanelHandle">
            <span>Главное окно · Вы</span>
            <span style="font-size:11px; color:var(--text-dim);">
              ⛶ — fullscreen · ESC — выход
            </span>
          </div>

          <div class="main-video-wrapper" id="mainVideoWrapper">
            <video
              id="mainVideo"
              class="main-video"
              autoplay
              playsinline
            ></video>

            <div class="main-video-controls">
              <div class="control-chip">
                👨‍🎓 Ваш экран
              </div>
              <button
                class="fs-btn"
                id="fullscreenBtn"
                type="button"
                aria-label="Полный экран"
              >
                <span class="fs-btn-icon" id="fsIcon">⛶</span>
              </button>
            </div>
          </div>

          <div class="resize-handle" id="videoResizeHandle"></div>
        </section>

        <aside class="side-panel" id="sidePanel">
          <div class="side-header" id="sidePanelHandle">
            <h2>Чат с учителем</h2>
            <span>Локальный чат (без сервера)</span>
          </div>

          <div class="chat-panel">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-attachments" id="chatAttachments"></div>
            <div class="chat-footer">
              <label class="file-btn-label" for="chatFileInput">📎</label>
              <input type="file" id="chatFileInput" multiple style="display:none;" />
              <input
                type="text"
                id="chatInput"
                class="chat-input"
                placeholder="Напишите сообщение..."
              />
              <button class="send-btn" id="chatSendBtn">➤</button>
            </div>
          </div>

          <div class="side-panel-footer">
            <div class="small-pill">👨‍🎓 Режим: Ученик</div>
            <div class="small-pill">🎧 Лучше использовать наушники</div>
          </div>

          <div class="resize-handle" id="sideResizeHandle"></div>
        </aside>
      </div>
    </main>

    <!-- PiP -->
    <div class="self-box" id="selfBox">
      <div class="self-header" id="selfBoxHandle">
        <div class="self-title">
          <span class="self-dot"></span>
          <span>Учитель (PiP)</span>
        </div>
        <div class="self-actions">
          <button class="swap-btn" id="toggleSelfBtn" type="button">
            🙈 Скрыть себя
          </button>
          <button class="swap-btn" id="swapBtn" type="button">
            ↔ Поменять местами
          </button>
        </div>
      </div>
      <div class="self-video-frame">
        <video
          id="selfVideo"
          class="self-video"
          autoplay
          muted
          playsinline
        ></video>
        <div class="self-overlay">
          <div class="self-label">Предпросмотр камеры</div>
          <div class="mute-pill">
            <span class="mute-dot"></span>
            <span>Микрофон включён</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let dragZIndex = 80;

    function makeDraggable(box, handle) {
      if (!box) return;
      const dragHandle = handle || box;

      let isDragging = false;
      let startX = 0;
      let startY = 0;
      let boxStartX = 0;
      let boxStartY = 0;

      dragHandle.style.touchAction = "none";

      dragHandle.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        isDragging = true;

        const rect = box.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        boxStartX = rect.left;
        boxStartY = rect.top;

        box.style.position = "fixed";
        box.style.left = rect.left + "px";
        box.style.top = rect.top + "px";
        box.style.right = "auto";
        box.style.bottom = "auto";
        box.style.zIndex = ++dragZIndex;

        box.classList.add("dragging");

        document.addEventListener("pointermove", pointerMove);
        document.addEventListener("pointerup", pointerUp);
      });

      function pointerMove(e) {
        if (!isDragging) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        let newX = boxStartX + dx;
        let newY = boxStartY + dy;

        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const rect = box.getBoundingClientRect();
        const margin = 8;
        const width = rect.width;
        const height = rect.height;

        if (newX < margin) newX = margin;
        if (newY < margin) newY = margin;
        if (newX + width > vw - margin) newX = vw - width - margin;
        if (newY + height > vh - margin) newY = vh - height - margin;

        box.style.left = newX + "px";
        box.style.top = newY + "px";
      }

      function pointerUp() {
        if (!isDragging) return;
        isDragging = false;
        box.classList.remove("dragging");
        document.removeEventListener("pointermove", pointerMove);
        document.removeEventListener("pointerup", pointerUp);
      }
    }

    function makeResizable(box, handle) {
      if (!box || !handle) return;

      let isResizing = false;
      let startX = 0;
      let startY = 0;
      let startWidth = 0;
      let startHeight = 0;

      handle.addEventListener("pointerdown", (e) => {
        e.stopPropagation();
        if (e.button !== 0) return;
        isResizing = true;

        const rect = box.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        startWidth = rect.width;
        startHeight = rect.height;

        box.style.position = "fixed";
        box.style.left = rect.left + "px";
        box.style.top = rect.top + "px";
        box.style.right = "auto";
        box.style.bottom = "auto";
        box.style.width = rect.width + "px";
        box.style.height = rect.height + "px";
        box.style.zIndex = ++dragZIndex;

        document.addEventListener("pointermove", pointerMove);
        document.addEventListener("pointerup", pointerUp);
      });

      function pointerMove(e) {
        if (!isResizing) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        let newWidth = startWidth + dx;
        let newHeight = startHeight + dy;

        const minWidth = 260;
        const minHeight = 180;
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const rect = box.getBoundingClientRect();

        if (newWidth < minWidth) newWidth = minWidth;
        if (newHeight < minHeight) newHeight = minHeight;
        if (rect.left + newWidth > vw - 8) newWidth = vw - 8 - rect.left;
        if (rect.top + newHeight > vh - 8) newHeight = vh - 8 - rect.top;

        box.style.width = newWidth + "px";
        box.style.height = newHeight + "px";
      }

      function pointerUp() {
        if (!isResizing) return;
        isResizing = false;
        document.removeEventListener("pointermove", pointerMove);
        document.removeEventListener("pointerup", pointerUp);
      }
    }

    // Камера/звук (локально)
    (async function initMedia() {
      const selfVideo = document.getElementById("selfVideo");
      const mainVideo = document.getElementById("mainVideo");

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        console.warn("getUserMedia не поддерживается в этом браузере");
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true,
        });

        if (mainVideo) mainVideo.srcObject = stream;
        if (selfVideo) selfVideo.srcObject = stream;
      } catch (err) {
        console.error("Ошибка доступа к камере/микрофону:", err);
        alert(
          "Не удалось получить доступ к камере/микрофону. Проверьте разрешения в браузере."
        );
      }
    })();

    // Fullscreen
    (function () {
      const wrapper = document.getElementById("mainVideoWrapper");
      const fsBtn = document.getElementById("fullscreenBtn");
      const fsIcon = document.getElementById("fsIcon");
      if (!wrapper || !fsBtn || !fsIcon) return;

      function isFullscreen() {
        return document.fullscreenElement === wrapper;
      }

      function updateIcon() {
        if (isFullscreen()) {
          fsIcon.textContent = "🗗";
          wrapper.classList.add("fullscreen-active");
        } else {
          fsIcon.textContent = "⛶";
          wrapper.classList.remove("fullscreen-active");
        }
      }

      fsBtn.addEventListener("click", async () => {
        try {
          if (!isFullscreen()) {
            await wrapper.requestFullscreen();
          } else {
            await document.exitFullscreen();
          }
        } catch (err) {
          console.error("Ошибка fullscreen:", err);
        }
      });

      document.addEventListener("fullscreenchange", updateIcon);
      updateIcon();
    })();

    // SWAP (пока только текст)
    (function () {
      const swapBtn = document.getElementById("swapBtn");
      const mainVideo = document.getElementById("mainVideo");
      const selfVideo = document.getElementById("selfVideo");
      if (!swapBtn || !mainVideo || !selfVideo) return;

      swapBtn.addEventListener("pointerdown", (e) => e.stopPropagation());

      let swapped = false;
      swapBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        swapped = !swapped;
        swapBtn.textContent = swapped
          ? "↔ Вернуть как было"
          : "↔ Поменять местами";
      });
    })();

    // Скрыть/показать PiP
    (function () {
      const selfBox = document.getElementById("selfBox");
      const toggleBtn = document.getElementById("toggleSelfBtn");
      if (!selfBox || !toggleBtn) return;

      toggleBtn.addEventListener("pointerdown", (e) => e.stopPropagation());

      let hidden = false;
      toggleBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        hidden = !hidden;
        selfBox.classList.toggle("hidden", hidden);
        toggleBtn.textContent = hidden
          ? "👁 Показать себя"
          : "🙈 Скрыть себя";
      });
    })();

    // Чат
    (function () {
      const messagesEl = document.getElementById("chatMessages");
      const attachmentsEl = document.getElementById("chatAttachments");
      const inputEl = document.getElementById("chatInput");
      const sendBtn = document.getElementById("chatSendBtn");
      const fileInput = document.getElementById("chatFileInput");

      if (!messagesEl || !inputEl || !sendBtn || !fileInput || !attachmentsEl) return;

      let pendingFiles = [];

      function renderAttachments() {
        attachmentsEl.innerHTML = "";
        pendingFiles.forEach((file) => {
          const pill = document.createElement("div");
          pill.className = "chat-attachment-pill";
          pill.textContent = file.name;
          attachmentsEl.appendChild(pill);
        });
      }

      fileInput.addEventListener("change", () => {
        pendingFiles = Array.from(fileInput.files || []);
        renderAttachments();
      });

      function addMessage(text, files) {
        const wrapper = document.createElement("div");
        wrapper.className = "chat-message me";

        const header = document.createElement("div");
        header.className = "chat-message-header";
        const who = document.createElement("span");
        who.textContent = "Вы";
        const when = document.createElement("span");
        const d = new Date();
        when.textContent =
          d.getHours().toString().padStart(2, "0") +
          ":" +
          d.getMinutes().toString().padStart(2, "0");
        header.appendChild(who);
        header.appendChild(when);

        const body = document.createElement("div");
        body.textContent = text || "";

        wrapper.appendChild(header);
        if (text) wrapper.appendChild(body);

        if (files && files.length > 0) {
          const filesWrap = document.createElement("div");
          filesWrap.style.marginTop = "2px";
          filesWrap.style.display = "flex";
          filesWrap.style.flexDirection = "column";
          filesWrap.style.gap = "2px";
          files.forEach((f) => {
            const pill = document.createElement("div");
            pill.className = "chat-attachment-pill";
            pill.textContent = "📎 " + f.name;
            filesWrap.appendChild(pill);
          });
          wrapper.appendChild(filesWrap);
        }

        messagesEl.appendChild(wrapper);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function send() {
        const text = inputEl.value.trim();
        if (!text && pendingFiles.length === 0) return;
        addMessage(text, pendingFiles);
        inputEl.value = "";
        pendingFiles = [];
        fileInput.value = "";
        renderAttachments();
      }

      sendBtn.addEventListener("click", send);
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
    })();

    // DRAG + RESIZE
    (function () {
      const selfBox = document.getElementById("selfBox");
      const selfHandle = document.getElementById("selfBoxHandle");
      const videoPanel = document.getElementById("videoPanel");
      const videoHandle = document.getElementById("videoPanelHandle");
      const sidePanel = document.getElementById("sidePanel");
      const sideHandle = document.getElementById("sidePanelHandle");
      const videoResize = document.getElementById("videoResizeHandle");
      const sideResize = document.getElementById("sideResizeHandle");

      makeDraggable(selfBox, selfHandle);
      makeDraggable(videoPanel, videoHandle);
      makeDraggable(sidePanel, sideHandle);

      makeResizable(videoPanel, videoResize);
      makeResizable(sidePanel, sideResize);
    })();
  </script>
</body>
</html>
