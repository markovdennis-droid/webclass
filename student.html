<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WebClass — Комната ученика</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #eef1ff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 20px 20px 22px;
            border-radius: 18px;
            width: 1100px;
            max-width: 96vw;
            box-shadow: 0 20px 40px rgba(15,23,42,0.18);
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: baseline;
            margin-bottom: 10px;
        }

        h2 {
            margin: 0;
        }

        .room {
            font-size: 13px;
            color: #6b7280;
        }

        .bottom-row {
            display: flex;
            gap: 18px;
            align-items: stretch;
        }

        /* ВИДЕО СЛЕВА (шире, чем чат) */
        .video-column {
            flex: 2.5;
            background: #020617;
            border-radius: 16px;
            padding: 14px;
            border: 1px solid #312e81;
            color: #e5e7eb;
            display: flex;
            flex-direction: column;
        }

        .video-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .video-wrapper {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            background: radial-gradient(circle at top, #1d4ed8, #0f172a 60%);
            padding: 12px;
            min-height: 360px;
        }

        .remote-box {
            border-radius: 12px;
            background: rgba(15,23,42,0.9);
            border: 1px solid rgba(129,140,248,0.6);
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #e5e7eb;
            font-size: 14px;
            text-align: center;
        }

        .remote-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            opacity: 0.7;
            margin-bottom: 6px;
        }

        .remote-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .remote-sub {
            font-size: 12px;
            color: #9ca3af;
        }

        .self-box {
            position: absolute;
            right: 14px;
            bottom: 14px;
            width: 28%;
            min-width: 140px;
            border-radius: 10px;
            background: rgba(15,23,42,0.98);
            border: 1px solid rgba(148,163,184,0.9);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
            color: #e5e7eb;
        }

        .self-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            opacity: 0.9;
        }

        .self-tag {
            font-weight: 600;
        }

        .self-preview {
            margin-top: 4px;
            border-radius: 7px;
            background: linear-gradient(135deg, #22c55e, #6366f1);
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #f9fafb;
            text-align: center;
        }

        .hint {
            font-size: 13px;
            color: #e5e7eb;
            margin-top: 10px;
        }

        .btn-exit {
            margin-top: 8px;
            padding: 8px 16px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 13px;
            cursor: pointer;
            align-self: flex-start;
            transition: background .2s;
        }

        .btn-exit:hover {
            background: #b91c1c;
        }

        /* ЧАТ СПРАВА */
        .chat-panel {
            flex: 0.9;
            background: #f3f4ff;
            border-radius: 16px;
            border: 1px solid #d4d4ff;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .chat-title {
            font-size: 14px;
            font-weight: 500;
        }

        .chat-status {
            font-size: 11px;
            color: #6b7280;
        }

        .chat-messages {
            flex: 1;
            background: white;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            padding: 8px;
            overflow-y: auto;
            font-size: 13px;
            margin-bottom: 6px;
