<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>WebClass — Ученик</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg-main: #050816;
      --bg-panel: #0b1020;
      --bg-panel-soft: #11172b;
      --accent: #4f46e5;
      --accent-soft: rgba(79, 70, 229, 0.25);
      --text-main: #f9fafb;
      --text-dim: #9ca3af;
      --radius-lg: 18px;
      --radius-xl: 22px;
      --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.55);
      --shadow-pip: 0 16px 40px rgba(0, 0, 0, 0.65);
      --border-soft: 1px solid rgba(148, 163, 184, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top, #1f2937 0, #020617 52%, #000 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .shell {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: row;
      gap: 14px;
      position: relative;
    }

    /* ---------- SIDE PANEL (CHAT) ---------- */

    #sidePanel {
      background: var(--bg-panel);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-soft);
      border: var(--border-soft);
      width: 360px;
      min-width: 280px;
      position: relative;
      overflow: hidden;
    }

    #sidePanelHandle {
      padding: 10px;
      background: var(--bg-panel-soft);
      cursor: grab;
      user-select: none;
      border-bottom: var(--border-soft);
      font-size: 14px;
      text-align: center;
      color: var(--text-dim);
    }

    .chat-area {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    #chatMessages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-size: 14px;
    }

    .chat-message {
      margin-bottom: 10px;
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--bg-panel-soft);
      box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.2);
    }

    .chat-message.me {
      background: rgba(79, 70, 229, 0.22);
      border: 1px solid rgba(129, 140, 248, 0.4);
    }

    .chat-message-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 11px;
      color: var(--text-dim);
    }

    #chatInput {
      width: 100%;
      padding: 10px;
      background: #1a2035;
      border: none;
      outline: none;
      color: var(--text-main);
      border-top: var(--border-soft);
      resize: none;
      height: 48px;
    }

    .chat-send-row {
      display: flex;
      align-items: center;
      padding: 6px;
      gap: 6px;
      border-top: var(--border-soft);
      background: #0e1425;
    }

    #chatSendBtn {
      padding: 8px 12px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    .attach-btn {
      cursor: pointer;
      padding: 8px;
      border-radius: 12px;
      background: #1f2937;
      border: var(--border-soft);
      color: #d1d5db;
    }

    #chatAttachments {
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.05);
      border-top: var(--border-soft);
    }

    .chat-attachment-pill {
      background: rgba(79, 70, 229, 0.2);
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 12px;
      color: #cbd5e1;
      border: 1px solid rgba(129, 140, 248, 0.4);
    }

    /* ---------- MAIN VIDEO PANEL ---------- */

    #videoPanel {
      position: relative;
      flex: 1;
      background: var(--bg-panel);
      border-radius: var(--radius-xl);
      border: var(--border-soft);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    #videoPanelHandle {
      padding: 10px;
      background: var(--bg-panel-soft);
      cursor: grab;
      text-align: center;
      font-size: 14px;
      color: var(--text-dim);
      user-select: none;
      border-bottom: var(--border-soft);
    }

    #mainVideoWrapper {
      position: relative;
      padding: 10px;
    }

    #mainVideo {
      width: 100%;
      border-radius: 16px;
      background: #000;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
    }

    #selfBox {
      position: absolute;
      right: 16px;
      bottom: 16px;
      width: 260px;
      background: #111827;
      border-radius: 12px;
      box-shadow: var(--shadow-pip);
      border: var(--border-soft);
      overflow: hidden;
    }

    #selfBoxHandle {
      padding: 6px 10px;
      font-size: 12px;
      cursor: grab;
      background: #1f2937;
      user-select: none;
      border-bottom: var(--border-soft);
    }

    #selfVideo {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 4/3;
      object-fit: cover;
    }

    #toggleSelfBtn {
      width: 100%;
      padding: 6px;
      border: none;
      background: #1e293b;
      font-size: 12px;
      color: #e5e7eb;
      cursor: pointer;
      border-top: var(--border-soft);
    }

    /* RESIZE HANDLES */
    #videoResizeHandle,
    #sideResizeHandle {
      width: 12px;
      height: 12px;
      position: absolute;
      right: 6px;
      bottom: 6px;
      cursor: nwse-resize;
      background: rgba(255,255,255,0.25);
      border-radius: 3px;
    }

    #sideResizeHandle {
      right: 6px;
      bottom: 6px;
    }
  </style>
</head>

<body>

<div class="shell">

  <!-- ================== SIDE PANEL (CHAT) ================== -->
  <div id="sidePanel">
    <div id="sidePanelHandle">Чат</div>

    <div class="chat-area">
      <div id="chatMessages"></div>

      <div id="chatAttachments"></div>

      <textarea id="chatInput" placeholder="Написать сообщение..."></textarea>

      <div class="chat-send-row">
        <label class="attach-btn">
          📎
          <input type="file" id="chatFileInput" multiple style="display:none" />
        </label>
        <button id="chatSendBtn">Отправить</button>
      </div>
    </div>

    <div id="sideResizeHandle"></div>
  </div>

  <!-- ================== VIDEO PANEL ================== -->
  <div id="videoPanel">
    <div id="videoPanelHandle">Ваш учитель</div>

    <div id="mainVideoWrapper">
      <video id="mainVideo" autoplay playsinline></video>

      <div id="selfBox">
        <div id="selfBoxHandle">Вы</div>
        <video id="selfVideo" autoplay playsinline muted></video>
        <button id="toggleSelfBtn">Скрыть себя</button>
      </div>
    </div>

    <div id="videoResizeHandle"></div>
  </div>

</div>

<!-- ================== WEBRTC + CHAT + DRAG + RESIZE ================== -->
<script>
(function () {
  const ROLE = "student";
  const params = new URLSearchParams(window.location.search);
  const roomId = params.get("room") || "default-room";

  const signalingUrl = `wss://webclass-backend-g3uh.onrender.com/ws/${roomId}`;

  const selfVideo = document.getElementById("selfVideo");
  const mainVideo = document.getElementById("mainVideo");

  let localStream = null;
  let remoteStream = null;
  let pc = null;
  let ws = null;

  start();

  async function start() {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
      });

      selfVideo.srcObject = localStream;
    } catch (err) {
      alert("Нет доступа к камере или микрофону.");
      return;
    }

    setupWebSocket();
  }

  function setupWebSocket() {
    ws = new WebSocket(signalingUrl);

    ws.onopen = () => send({ type: "ready", role: ROLE });

    ws.onmessage = async (event) => {
      let msg = JSON.parse(event.data);

      if (msg.role === ROLE) return;

      switch (msg.type) {
        case "offer":
          await ensurePeer();
          await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          send({ type: "answer", sdp: pc.localDescription, role: ROLE });
          break;

        case "answer":
          if (pc) await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
          break;

        case "candidate":
          if (pc && msg.candidate) {
            try { await pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); }
            catch (e) { console.warn(e); }
          }
          break;
      }
    };
  }

  function send(payload) {
    if (ws?.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(payload));
    }
  }

  async function ensurePeer() {
    if (pc) return;

    pc = new RTCPeerConnection({
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    });

    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    pc.onicecandidate = e => {
      if (e.candidate)
        send({ type: "candidate", candidate: e.candidate, role: ROLE });
    };

    pc.ontrack = e => {
      const stream = e.streams[0];
      if (!remoteStream) {
        remoteStream = new MediaStream();
        mainVideo.srcObject = remoteStream;
      }
      stream.getTracks().forEach(t => remoteStream.addTrack(t));
    };
  }
})();
</script>

<!-- DRAG / RESIZE / CHAT ------------------------------- -->
<script>
(function () {
  const boxes = [
    { box: sidePanel, handle: sidePanelHandle },
    { box: videoPanel, handle: videoPanelHandle },
    { box: selfBox, handle: selfBoxHandle }
  ];

  boxes.forEach(({box, handle}) => makeDraggable(box, handle));

  makeResizable(sidePanel, sideResizeHandle);
  makeResizable(videoPanel, videoResizeHandle);

  function makeDraggable(box, handle) {
    let startX, startY, boxX, boxY, dragging = false;

    handle.addEventListener("pointerdown", e => {
      dragging = true;
      const rect = box.getBoundingClientRect();
      startX = e.clientX;
      startY = e.clientY;
      boxX = rect.left;
      boxY = rect.top;
      box.style.position = "fixed";
      box.style.zIndex = 999;
    });

    document.addEventListener("pointermove", e => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      box.style.left = boxX + dx + "px";
      box.style.top = boxY + dy + "px";
    });

    document.addEventListener("pointerup", () => dragging = false);
  }

  function makeResizable(box, handle) {
    let startX, startY, startW, startH, resizing = false;

    handle.addEventListener("pointerdown", e => {
      e.stopPropagation();
      resizing = true;

      const rect = box.getBoundingClientRect();
      startX = e.clientX;
      startY = e.clientY;
      startW = rect.width;
      startH = rect.height;

      box.style.position = "fixed";
      box.style.width = rect.width + "px";
      box.style.height = rect.height + "px";
    });

    document.addEventListener("pointermove", e => {
      if (!resizing) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      box.style.width = startW + dx + "px";
      box.style.height = startH + dy + "px";
    });

    document.addEventListener("pointerup", () => resizing = false);
  }

  // TOGGLE SELF PIP
  toggleSelfBtn.onclick = () => {
    if (selfVideo.style.display === "none") {
      selfVideo.style.display = "block";
      toggleSelfBtn.textContent = "Скрыть себя";
    } else {
      selfVideo.style.display = "none";
      toggleSelfBtn.textContent = "Показать себя";
    }
  };

  // CHAT
  const sendBtn = document.getElementById("chatSendBtn");
  const chatInput = document.getElementById("chatInput");
  const chatMessages = document.getElementById("chatMessages");
  const chatAttachments = document.getElementById("chatAttachments");
  const chatFileInput = document.getElementById("chatFileInput");

  let pendingFiles = [];

  chatFileInput.onchange = () => {
    pendingFiles = [...chatFileInput.files];
    renderAttachments();
  };

  function renderAttachments() {
    chatAttachments.innerHTML = "";
    pendingFiles.forEach(f => {
      const div = document.createElement("div");
      div.className = "chat-attachment-pill";
      div.textContent = f.name;
      chatAttachments.appendChild(div);
    });
  }

  sendBtn.onclick = sendMessage;
  chatInput.onkeydown = e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  };

  function sendMessage() {
    const text = chatInput.value.trim();
    if (!text && pendingFiles.length === 0) return;

    addMessage("Вы", text, pendingFiles);

    chatInput.value = "";
    pendingFiles = [];
    chatFileInput.value = "";
    renderAttachments();
  }

  function addMessage(sender, text, files) {
    const msg = document.createElement("div");
    msg.className = "chat-message me";

    const header = document.createElement("div");
    header.className = "chat-message-header";
    header.innerHTML = `<span>${sender}</span><span>${new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})}</span>`;
    msg.appendChild(header);

    if (text) {
      const body = document.createElement("div");
      body.textContent = text;
      msg.appendChild(body);
    }

    if (files?.length > 0) {
      files.forEach(f => {
        const pill = document.createElement("div");
        pill.className = "chat-attachment-pill";
        pill.textContent = "📎 " + f.name;
        msg.appendChild(pill);
      });
    }

    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
})();
</script>

</body>
</html>
