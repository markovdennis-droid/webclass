<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WebClass — Комната ученика</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #eef1ff; /* тот же светлый фон, как login/teacher */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            width: 420px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.12);
            text-align: center;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .room {
            font-size: 14px;
            color: #68708a;
            margin-bottom: 18px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }

        .video-box {
            background: #f3f4ff;
            border-radius: 10px;
            padding: 18px 10px;
            font-size: 13px;
            color: #4b5563;
            border: 1px dashed #c7cffc;
        }

        .video-label {
            font-weight: 600;
            margin-bottom: 4px;
            display: block;
        }

        .hint {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .btn-exit {
            padding: 10px 20px;
            background: #e11d48;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background .2s;
        }

        .btn-exit:hover {
            background: #be123c;
        }
    </style>
</head>

<body>
<div class="card">
    <h2>Урок WebClass</h2>
    <div id="roomInfo" class="room"></div>

    <div class="video-grid">
        <div class="video-box">
            <span class="video-label">Учитель</span>
            Здесь будет видео учителя.
        </div>
        <div class="video-box">
            <span class="video-label">Ученик</span>
            Здесь будет ваше видео.
        </div>
    </div>

    <div class="hint">
        Вы уже в комнате. Просто дождитесь, пока учитель подключится.<br>
        На следующем шаге сюда добавим видео и звук.
    </div>

    <button class="btn-exit" onclick="goHome()">Выйти из урока</button>
</div>

<script>
    // читаем ID комнаты из ссылки
    const params = new URLSearchParams(window.location.search);
    const room = params.get("room") || "неизвестно";

    document.getElementById("roomInfo").textContent = "Комната: " + room;

    function goHome() {
        // возвращаем на главную (корень сайта)
        window.location.href = "/";
    }
</script>

</body>
</html>
