<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WebClass • онлайн-уроки 1:1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: radial-gradient(circle at top, #4f46e5 0, #0f172a 55%, #020617 100%);
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(15, 23, 42, 0.8);
            padding: 32px;
            border-radius: 24px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        p {
            font-size: 15px;
            color: #cbd5f6;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 999px;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(99,102,241,0.6);
            transition: 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(99,102,241,0.8);
        }
    </style>
</head>
<body>
<div class="card">
    <h1>WebClass</h1>
    <p>
        Платформа для онлайн-уроков <b>учитель → ученик</b>.<br>
        Ученик заходит по ссылке, которую создаёт учитель.<br><br>
        Сейчас выполняется тестовая версия.
    </p>

    <a class="btn" href="login.html">Вход для учителей</a>
</div>
</body>
</html>
